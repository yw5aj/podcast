<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#171c2b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef0f5" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>我的播客</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* 夜里的收音机：深蓝底，琥珀色只用来表示"进度"和"正在放"。 */
  :root {
    --bg: #171c2b; --surface: #20273b; --line: #2e3650; --ink: #eceef4; --dim: #8e96ab;
    --amber: #f0b54a; --amber-ink: #2a1e05; --warn: #ef9a84;
    --tile-s: 30%; --tile-l: 27%; --glyph-s: 50%; --glyph-l: 84%;
    --serif: "Noto Serif SC", "Songti SC", "Source Han Serif SC", "SimSun", serif;
    --sans: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eef0f5; --surface: #ffffff; --line: #d5d9e4; --ink: #1a2238; --dim: #636c84;
      --amber: #b8730a; --amber-ink: #fff8ea; --warn: #b3422a;
      --tile-s: 34%; --tile-l: 82%; --glyph-s: 40%; --glyph-l: 27%;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 16px 8px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  #q { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
    color: var(--ink); font: 16px var(--sans); padding: 8px 0; }
  #q::placeholder { color: var(--dim); }
  #q:focus { outline: none; border-bottom-color: var(--amber); }
  .topbar { display: flex; align-items: center; gap: 14px; }
  .topbar #q { flex: 1; min-width: 0; }
  #qbtn { flex: none; font-size: 14px; white-space: nowrap; border: 1px solid var(--line); border-radius: 16px;
    padding: 6px 12px; }
  #qbtn b { color: var(--amber); font-variant-numeric: tabular-nums; }
  #showbar { display: none; }
  #back2 { color: var(--dim); font-size: 14px; padding: 8px 12px 8px 0; }
  body.inshow .topbar { display: none; }
  body.inshow #showbar { display: block; }

  main { padding: 8px 16px 230px; max-width: 672px; margin: 0 auto; }
  .note { color: var(--dim); font-size: 14px; padding: 16px 0; }

  /* 节目架：封面就是主角 */
  .shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 14px; padding-top: 10px;
    align-items: start; }
  @media (min-width: 560px) { .shelf { grid-template-columns: repeat(4, 1fr); } }
  .tile { position: relative; text-align: left; display: block; min-width: 0; }
  .tile.off { opacity: .38; }
  .cover { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 1;
    border-radius: 10px; object-fit: cover;
    background: hsl(var(--h, 220) var(--tile-s) var(--tile-l));
    color: hsl(var(--h, 220) var(--glyph-s) var(--glyph-l));
    font: 700 clamp(34px, 13vw, 58px)/1 var(--serif); }
  .tile .name { font: 500 14px/1.35 var(--serif); margin-top: 7px; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tile .sub { font-size: 12px; color: var(--dim); margin-top: 1px; }
  .badge { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; padding: 0 6px;
    border-radius: 11px; background: var(--amber); color: var(--amber-ink);
    font: 700 12px/22px var(--sans); text-align: center; font-variant-numeric: tabular-nums; }
  .tile .flag { position: absolute; left: 6px; bottom: 6px; font-size: 12px; padding: 2px 8px; border-radius: 10px;
    background: var(--bg); color: var(--ink); }
  .tile .box { position: relative; }
  #manage { display: block; margin: 26px 0 0; color: var(--dim); font-size: 14px; padding: 8px 0;
    text-decoration: underline; text-underline-offset: 3px; }
  .lead { font-size: 14px; color: var(--dim); margin: 30px 0 2px; }

  /* 节目页抬头 */
  .showhead { display: flex; gap: 14px; align-items: center; padding: 4px 0 14px; }
  .showhead .cover { width: 72px; flex: none; font-size: 34px; }
  .showhead h1, .qhead h1 { font: 700 22px/1.3 var(--serif); margin: 0; }
  .qhead { padding: 4px 0 14px; }
  .qhead p { margin: 3px 0 0; font-size: 13px; color: var(--dim); }
  .showhead p { margin: 3px 0 0; font-size: 13px; color: var(--dim); }

  /* 单集：一行一集，用线分开，不用卡片 */
  .ep { display: flex; align-items: stretch; position: relative; border-top: 1px solid var(--line); }
  .ep .main { flex: 1; min-width: 0; text-align: left; padding: 13px 4px 15px 0; }
  .ep .t { font: 500 16px/1.45 var(--serif); overflow-wrap: anywhere; }
  .ep .m { font-size: 12.5px; color: var(--dim); margin-top: 4px; font-variant-numeric: tabular-nums;
    display: flex; flex-wrap: wrap; gap: 0 12px; }
  .ep .m .at { color: var(--amber); }
  .ep.done .t { color: var(--dim); }
  .ep.now .t { color: var(--amber); }
  .ep .bar { position: absolute; left: 0; top: -1px; height: 2px; background: var(--amber); }
  .ep .chk { flex: none; width: 50px; display: flex; align-items: center; justify-content: flex-start; }
  .ep .chk::before { content: ""; display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 17px; border: 1.5px solid var(--dim); box-sizing: border-box;
    font: 600 18px/1 var(--sans); }
  .ep.done .chk::before { content: "✓"; background: var(--line); border-color: var(--line); color: var(--ink); }
  .ep .add { flex: none; width: 54px; display: flex; align-items: center; justify-content: center; }
  .ep .add::before { content: "+"; display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 19px; border: 1.5px solid var(--dim); color: var(--ink);
    font: 400 26px/1 var(--sans); padding-bottom: 2px; box-sizing: border-box; }
  .ep .add.in::before { content: "−"; background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
  .ep .ord { flex: none; width: 38px; color: var(--dim); font-size: 17px; }
  .ep .grip { flex: none; width: 46px; color: var(--dim); font-size: 20px; touch-action: none; cursor: grab; }
  .ep.shift { transition: transform .16s ease; }
  .ep.drag { z-index: 3; background: var(--surface); border-top-color: transparent; border-radius: 10px;
    box-shadow: 0 8px 22px rgba(0, 0, 0, .35); transition: none; }
  .ep.drag .grip { color: var(--amber); cursor: grabbing; }
  @media (prefers-reduced-motion: reduce) { .ep.shift { transition: none; } }
  .ep .num { flex: none; width: 26px; padding-top: 14px; color: var(--dim); font: 500 15px/1.45 var(--serif);
    font-variant-numeric: tabular-nums; }
  .ep.now .num { color: var(--amber); }
  #startq { margin: 2px 0 16px; background: var(--amber); color: var(--amber-ink); font-size: 15px; font-weight: 600;
    padding: 9px 18px; border-radius: 20px; }

  /* 播放器 */
  #player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface);
    border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); z-index: 6; }
  #pTitle { font: 500 15px/1.4 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pShow { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #msg { font-size: 12.5px; color: var(--warn); margin-top: 4px; display: none; }
  #seek { width: 100%; margin: 8px 0 0; accent-color: var(--amber); height: 24px; }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim);
    font-variant-numeric: tabular-nums; }
  .ctl { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .ctl button { min-width: 52px; height: 48px; border-radius: 24px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .ctl .sm { color: var(--dim); font-size: 13px; }
  .ctl .sm.on { color: var(--amber); }
  .ctl .skip { font-size: 15px; font-weight: 600; }
  #play { background: var(--amber); color: var(--amber-ink); width: 58px; height: 58px; border-radius: 29px; font-size: 22px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="topbar">
      <input id="q" type="search" placeholder="搜索单集标题或嘉宾" aria-label="搜索单集" autocomplete="off">
      <button id="qbtn">播放列表</button>
    </div>
    <div id="showbar"><button id="back2">‹ 全部节目</button></div>
  </div>
</header>
<main id="list"><div class="note">正在加载节目…</div></main>

<div id="player">
  <div class="wrap">
    <div id="pTitle">选一集开始听</div>
    <div id="pShow">&nbsp;</div>
    <div id="msg"></div>
    <input id="seek" type="range" min="0" max="1" step="1" value="0" aria-label="播放进度" disabled>
    <div class="times"><span id="cur">0:00</span><span id="rem">0:00</span></div>
    <div class="ctl">
      <button id="rate" class="sm" aria-label="播放速度">1x</button>
      <button id="back" class="skip" aria-label="后退15秒">−15</button>
      <button id="play" aria-label="播放">▶</button>
      <button id="fwd" class="skip" aria-label="前进15秒">+15</button>
      <button id="sleep" class="sm" aria-label="睡眠定时">定时</button>
    </div>
  </div>
</div>
<audio id="a" preload="metadata"></audio>

<script>
// 节目数据在 shows.json 里，由定时任务更新；本页只负责播放和记进度。
// 首页是节目架；点进节目看单集（地址栏 #s-<节目id>，手机返回键可回首页）。
const SKIP = 15;
const RATES = [0.8, 1, 1.25, 1.5, 1.75, 2, 2.5, 3];
const SLEEPS = [0, 15, 30, 60, -1]; // 分钟；-1 = 本集结束
const KEY = "xyzplayer.v1";

const $ = id => document.getElementById(id);
const a = $("a");
let SHOWS = [];
const EPS = {};

// ----- 存储（只在当前浏览器里）-----
let state = { prog: {}, rate: 1, last: null, hidden: {}, queue: [] };
let storageOK = true;
try {
  const raw = localStorage.getItem(KEY);
  if (raw) state = Object.assign(state, JSON.parse(raw));
} catch (e) { storageOK = false; }
if (!state.hidden) state.hidden = {};
if (!Array.isArray(state.queue)) state.queue = [];
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { storageOK = false; }
}

let cur = null;         // 当前单集 id
let pendingSeek = null; // 元数据加载后要跳到的位置
let seeking = false;
let sleepIdx = 0, sleepAt = 0;
let lastSave = 0;
let query = "";
let loadErr = "";
let managing = false;

function fmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(ss).padStart(2, "0");
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function viewShow() {
  const m = /^#s-([0-9a-f]{24})$/.exec(location.hash);
  return m ? SHOWS.find(s => s.id === m[1]) || null : null;
}
function viewQueue() { return location.hash === "#queue"; }
function toggleQueue(id) {
  const i = state.queue.indexOf(id);
  if (i >= 0) state.queue.splice(i, 1); else state.queue.push(id);
  save(); render();
}
function moveQueue(i, d) {
  const j = i + d;
  if (j < 0 || j >= state.queue.length) return;
  const q = state.queue;
  [q[i], q[j]] = [q[j], q[i]];
  save(); render();
}
function nextInQueue() {
  const i = state.queue.indexOf(cur);
  const n = i >= 0 ? state.queue[i + 1] : state.queue[0];
  if (n && EPS[n]) load(n, true);
}
function unheardOf(s) {
  return s.episodes.filter(e => e.audio && !(state.prog[e.id] || {}).done).length;
}

// ----- 单集行 -----
function row(e, withShow) {
  const p = state.prog[e.id] || {};
  const r = el("div", "ep" + (p.done ? " done" : "") + (e.id === cur ? " now" : ""));
  const b = el("button", "main");
  const m = el("div", "m");
  if (withShow) m.appendChild(el("span", null, e.show));
  if (e.date) m.appendChild(el("span", null, e.date));
  m.appendChild(el("span", null, e.min + " 分钟"));
  if (p.done) m.appendChild(el("span", null, "已听完"));
  else if (p.t > 5) m.appendChild(el("span", "at", "听到 " + fmt(p.t)));
  b.append(el("div", "t", e.title), m);
  b.onclick = () => play(e.id);
  const c = el("button", "chk");
  c.setAttribute("aria-label", p.done ? "标为未听" : "标为已听");
  c.onclick = () => {
    const q = state.prog[e.id] = state.prog[e.id] || { t: 0 };
    q.done = !q.done;
    if (!q.done) q.t = 0;
    save(); render();
  };
  const inQ = state.queue.includes(e.id);
  const add = el("button", "add" + (inQ ? " in" : ""));
  add.setAttribute("aria-label", inQ ? "从播放列表移除" : "加入播放列表");
  add.onclick = () => toggleQueue(e.id);
  r.append(c, b, add);
  if (!p.done && p.t > 5) {
    const bar = el("div", "bar");
    bar.style.width = Math.min(100, p.t / (p.d || e.min * 60) * 100) + "%";
    r.appendChild(bar);
  }
  return r;
}

// ----- 拖动排序：按住手柄上下拖，松手落位 -----
function startDrag(ev, i, grip) {
  if (ev.button > 0) return;
  ev.preventDefault();
  const rows = [...document.querySelectorAll("#list .ep")];
  const me = rows[i];
  const rects = rows.map(r => { const b = r.getBoundingClientRect(); return { top: b.top + scrollY, h: b.height }; });
  const startY = ev.clientY + scrollY;
  let to = i, lastY = ev.clientY;
  me.classList.add("drag");
  try { grip.setPointerCapture(ev.pointerId); } catch (e) {}
  const place = () => {
    const dy = lastY + scrollY - startY;
    me.style.transform = "translateY(" + dy + "px)";
    const c = rects[i].top + rects[i].h / 2 + dy;
    let n = i;
    rows.forEach((r, j) => {
      if (j === i) return;
      const cj = rects[j].top + rects[j].h / 2;
      let shift = 0;
      if (j < i && c < cj) { shift = rects[i].h; n--; }
      else if (j > i && c > cj) { shift = -rects[i].h; n++; }
      r.classList.add("shift");
      r.style.transform = shift ? "translateY(" + shift + "px)" : "";
    });
    to = n;
  };
  // 拖到屏幕上下边缘时自动滚动
  const timer = setInterval(() => {
    const bottom = innerHeight - $("player").offsetHeight;
    if (lastY < 90) scrollBy(0, -10);
    else if (lastY > bottom - 40) scrollBy(0, 10);
    else return;
    place();
  }, 16);
  const move = e => { lastY = e.clientY; place(); };
  const end = () => {
    clearInterval(timer);
    grip.removeEventListener("pointermove", move);
    grip.removeEventListener("pointerup", end);
    grip.removeEventListener("pointercancel", end);
    if (to !== i) {
      const [x] = state.queue.splice(i, 1);
      state.queue.splice(to, 0, x);
      save();
    }
    render();
  };
  grip.addEventListener("pointermove", move);
  grip.addEventListener("pointerup", end);
  grip.addEventListener("pointercancel", end);
}

// ----- 播放列表里的一行：序号、标题、拖动手柄、移除 -----
function queueRow(e, i, n) {
  const p = state.prog[e.id] || {};
  const r = el("div", "ep" + (e.id === cur ? " now" : ""));
  const b = el("button", "main");
  const m = el("div", "m");
  m.append(el("span", null, e.show), el("span", null, e.min + " 分钟"));
  if (!p.done && p.t > 5) m.appendChild(el("span", "at", "听到 " + fmt(p.t)));
  b.append(el("div", "t", e.title), m);
  b.onclick = () => play(e.id);
  const grip = el("button", "grip", "≡"), rm = el("button", "ord", "×");
  grip.setAttribute("aria-label", "拖动调整顺序，或用上下方向键");
  rm.setAttribute("aria-label", "从播放列表移除");
  grip.addEventListener("pointerdown", ev => startDrag(ev, i, grip));
  grip.addEventListener("keydown", ev => {
    const d = ev.key === "ArrowUp" ? -1 : ev.key === "ArrowDown" ? 1 : 0;
    if (!d || i + d < 0 || i + d >= n) return;
    ev.preventDefault();
    moveQueue(i, d);
    const g = document.querySelectorAll("#list .grip")[i + d];
    if (g) g.focus();
  });
  rm.onclick = () => toggleQueue(e.id);
  r.append(el("div", "num", String(i + 1)), b, grip, rm);
  return r;
}

// ----- 封面：有图用图，没有就用节目名的第一个字 -----
function cover(s) {
  const hue = parseInt(s.id.slice(-6), 16) % 360;
  const glyph = () => {
    const d = el("div", "cover", s.title.trim().charAt(0));
    d.style.setProperty("--h", hue);
    d.setAttribute("aria-hidden", "true");
    return d;
  };
  if (!s.cover) return glyph();
  const img = el("img", "cover");
  img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
  img.style.setProperty("--h", hue);
  img.onerror = () => img.replaceWith(glyph());
  img.src = s.cover;
  return img;
}
function tile(s) {
  const hidden = !!state.hidden[s.id];
  const playable = s.episodes.some(e => e.audio);
  const unheard = unheardOf(s);
  const b = el("button", "tile" + (hidden ? " off" : ""));
  const box = el("div", "box");
  box.appendChild(cover(s));
  if (managing) box.appendChild(el("span", "flag", hidden ? "已隐藏" : "显示中"));
  else if (unheard) {
    const badge = el("span", "badge", String(unheard));
    badge.setAttribute("aria-label", unheard + " 集未听");
    box.appendChild(badge);
  }
  b.append(box, el("div", "name", s.title));
  if (!playable) b.appendChild(el("div", "sub", "单集补充中"));
  b.onclick = managing
    ? () => { if (hidden) delete state.hidden[s.id]; else state.hidden[s.id] = true; save(); render(); }
    : () => { location.hash = "s-" + s.id; };
  return b;
}

// ----- 渲染 -----
function render() {
  const list = $("list");
  const show = viewShow();
  const inQueue = viewQueue();
  document.body.classList.toggle("inshow", !!show || inQueue);
  const qb = $("qbtn");
  qb.textContent = "播放列表";
  if (state.queue.length) { qb.append(" ", el("b", null, String(state.queue.length))); }
  list.textContent = "";
  if (loadErr) { list.appendChild(el("div", "note", loadErr)); return; }
  if (!storageOK) list.appendChild(el("div", "note", "这个浏览器不让保存数据，关掉页面后进度会丢。"));
  const playable = Object.values(EPS);

  if (inQueue) {
    const items = state.queue.map(id => EPS[id]).filter(Boolean);
    const head = el("div", "qhead");
    head.append(el("h1", null, "播放列表"),
      el("p", null, items.length ? items.length + " 集，放完一集自动接着放下一集" : "只存在这台手机上"));
    list.appendChild(head);
    if (!items.length) {
      list.appendChild(el("div", "note", "列表还是空的。进任意一档节目，点单集右边的 +，把它加进来。"));
      return;
    }
    if (!state.queue.includes(cur)) {
      const st = el("button", null, "从第一集开始放");
      st.id = "startq";
      st.onclick = () => load(items[0].id, true);
      list.appendChild(st);
    }
    items.forEach((e, i) => list.appendChild(queueRow(e, i, items.length)));
    return;
  }

  if (show) {
    const ok = show.episodes.filter(e => e.audio);
    const missing = show.episodes.length - ok.length;
    const unheard = unheardOf(show);
    const head = el("div", "showhead");
    const txt = el("div");
    txt.append(el("h1", null, show.title),
      el("p", null, !ok.length ? "单集补充中" : unheard ? unheard + " 集未听，共 " + ok.length + " 集" : "共 " + ok.length + " 集，都听完了"));
    head.append(cover(show), txt);
    list.appendChild(head);
    if (!ok.length) list.appendChild(el("div", "note", "这档节目的单集还没抓到，下次更新后会出现。"));
    ok.forEach(e => list.appendChild(row(EPS[e.id], false)));
    if (ok.length && missing) list.appendChild(el("div", "note", "还有 " + missing + " 集的音频没抓到，下次更新后会出现。"));
    return;
  }

  if (query) {
    const q = query.toLowerCase();
    const hits = playable.filter(e => (e.title + " " + e.show).toLowerCase().includes(q));
    if (!hits.length) list.appendChild(el("div", "note", "没有标题里带“" + query + "”的单集。"));
    hits.forEach(e => list.appendChild(row(e, true)));
    return;
  }

  const visible = SHOWS.filter(s => managing || !state.hidden[s.id]);
  if (managing) list.appendChild(el("div", "note", "点一下封面，选择这台手机上要不要显示它。"));
  if (!visible.length) list.appendChild(el("div", "note", "节目都被隐藏了。点“管理节目”把想听的显示出来。"));
  const shelf = el("div", "shelf");
  visible.forEach(s => shelf.appendChild(tile(s)));
  list.appendChild(shelf);

  if (!managing) {
    const going = playable.filter(e => {
      const p = state.prog[e.id]; return e.id !== cur && p && !p.done && p.t > 5;
    }).sort((x, y) => (state.prog[y.id].at || 0) - (state.prog[x.id].at || 0)).slice(0, 5);
    if (going.length) {
      list.appendChild(el("div", "lead", "听到一半的"));
      going.forEach(e => list.appendChild(row(e, true)));
    }
  }
  const hiddenCount = SHOWS.filter(s => state.hidden[s.id]).length;
  const mb = el("button", null, managing ? "完成" : (hiddenCount ? "管理节目（隐藏了 " + hiddenCount + " 档）" : "管理节目"));
  mb.id = "manage";
  mb.onclick = () => { managing = !managing; render(); };
  list.appendChild(mb);
}

// ----- 播放 -----
function showMsg(t) { const m = $("msg"); m.textContent = t || ""; m.style.display = t ? "block" : "none"; }

function load(id, autoplay) {
  const e = EPS[id];
  if (!e) return;
  if (cur && cur !== id) record(true);
  cur = id;
  state.last = id; save();
  showMsg("");
  const p = state.prog[id] || {};
  pendingSeek = (!p.done && p.t > 5) ? p.t : 0;
  a.src = e.audio;
  a.playbackRate = state.rate;
  $("pTitle").textContent = e.title;
  $("pShow").textContent = e.show;
  $("seek").disabled = false;
  $("seek").max = p.d || e.min * 60;
  $("seek").value = pendingSeek;
  $("cur").textContent = fmt(pendingSeek);
  $("rem").textContent = "-" + fmt(($("seek").max) - pendingSeek);
  if ("mediaSession" in navigator) {
    try {
      const meta = { title: e.title, artist: e.show };
      if (e.cover) meta.artwork = [{ src: e.cover }];
      navigator.mediaSession.metadata = new MediaMetadata(meta);
    } catch (err) {}
  }
  render();
  if (autoplay) a.play().catch(() => showMsg("没能开始播放，再点一次播放键。"));
}
function play(id) {
  if (id === cur) { toggle(); return; }
  load(id, true);
}
function toggle() {
  if (!cur) return;
  if (a.paused) a.play().catch(() => showMsg("没能开始播放，再点一次播放键。"));
  else a.pause();
}
function skip(d) {
  if (!cur || !isFinite(a.duration)) return;
  a.currentTime = Math.min(Math.max(0, a.currentTime + d), a.duration - 1);
  record(true);
}
function record(force) {
  if (!cur || pendingSeek !== null) return;
  const now = Date.now();
  if (!force && now - lastSave < 5000) return;
  lastSave = now;
  const p = state.prog[cur] = state.prog[cur] || {};
  p.t = a.currentTime;
  if (isFinite(a.duration)) p.d = a.duration;
  p.at = now;
  if (p.d && p.t > p.d - 20) { p.done = true; }
  save();
}

a.addEventListener("loadedmetadata", () => {
  $("seek").max = Math.floor(a.duration);
  if (pendingSeek) a.currentTime = Math.min(pendingSeek, a.duration - 2);
  pendingSeek = null;
  a.playbackRate = state.rate;
});
a.addEventListener("timeupdate", () => {
  if (pendingSeek !== null) return;
  if (!seeking) {
    $("seek").value = a.currentTime;
    $("cur").textContent = fmt(a.currentTime);
    $("rem").textContent = "-" + fmt((a.duration || 0) - a.currentTime);
  }
  record(false);
  if (sleepAt > 0 && Date.now() >= sleepAt) { a.pause(); setSleep(0); }
});
a.addEventListener("play", () => { $("play").textContent = "❚❚"; $("play").setAttribute("aria-label", "暂停"); showMsg(""); });
a.addEventListener("pause", () => { $("play").textContent = "▶"; $("play").setAttribute("aria-label", "播放"); record(true); render(); });
a.addEventListener("ended", () => {
  const p = state.prog[cur] = state.prog[cur] || {};
  p.done = true; p.t = 0;
  // 这一集在播放列表里：放完就移出列表，接着放它后面那一集
  let next = null;
  const i = state.queue.indexOf(cur);
  if (i >= 0) { state.queue.splice(i, 1); next = state.queue[i] || null; }
  save(); render();
  if (SLEEPS[sleepIdx] === -1) { setSleep(0); return; }  // 定时"本集完"：不接着放
  if (next && EPS[next]) load(next, true);
});
a.addEventListener("error", () => {
  if (!cur) return;
  showMsg("这一集放不出来。先检查网络；网络没问题的话，是这一集的音频地址有误。");
});
a.addEventListener("waiting", () => { if (!a.paused) showMsg("缓冲中…"); });
a.addEventListener("playing", () => showMsg(""));

// ----- 控件 -----
$("play").onclick = toggle;
$("back").onclick = () => skip(-SKIP);
$("fwd").onclick = () => skip(SKIP);
function showRate() {
  $("rate").textContent = state.rate + "x";
  $("rate").classList.toggle("on", state.rate !== 1);
}
$("rate").onclick = () => {
  const i = RATES.indexOf(state.rate);
  state.rate = RATES[(i + 1) % RATES.length];
  a.playbackRate = state.rate;
  showRate(); save();
};
function setSleep(i) {
  sleepIdx = i;
  const v = SLEEPS[i];
  sleepAt = v > 0 ? Date.now() + v * 60000 : 0;
  $("sleep").textContent = v === 0 ? "定时" : v === -1 ? "本集完" : v + "分";
  $("sleep").classList.toggle("on", v !== 0);
}
$("sleep").onclick = () => setSleep((sleepIdx + 1) % SLEEPS.length);
const seek = $("seek");
seek.addEventListener("input", () => { seeking = true; $("cur").textContent = fmt(seek.value); });
seek.addEventListener("change", () => {
  seeking = false;
  if (pendingSeek !== null) { pendingSeek = Number(seek.value); return; }
  a.currentTime = Number(seek.value);
  record(true);
});
$("q").addEventListener("input", () => { query = $("q").value.trim(); managing = false; render(); });
$("back2").onclick = () => { location.hash = ""; };
$("qbtn").onclick = () => { location.hash = "queue"; };
window.addEventListener("hashchange", () => { managing = false; render(); window.scrollTo(0, 0); });

if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession;
  const set = (k, f) => { try { ms.setActionHandler(k, f); } catch (e) {} };
  set("play", () => a.play());
  set("pause", () => a.pause());
  set("seekbackward", () => skip(-SKIP));
  set("seekforward", () => skip(SKIP));
  set("nexttrack", nextInQueue);
  set("seekto", d => { if (d && d.seekTime != null) { a.currentTime = d.seekTime; record(true); } });
}
document.addEventListener("visibilitychange", () => { if (document.hidden) record(true); });
window.addEventListener("pagehide", () => record(true));

// ----- 启动 -----
showRate();
fetch("shows.json?t=" + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(j => {
    SHOWS = j.shows || [];
    SHOWS.forEach(s => s.episodes.forEach(e => {
      if (e.audio) EPS[e.id] = Object.assign({ show: s.title, cover: s.cover || null }, e);
    }));
    state.queue = state.queue.filter(id => EPS[id]);
    render();
    if (state.last && EPS[state.last]) load(state.last, false);
  })
  .catch(() => { loadErr = "节目列表没加载出来。检查网络后刷新页面。"; render(); });
</script>
</body>
</html>
