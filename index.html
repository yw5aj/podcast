<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#171c2b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef0f5" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>贴贴电台</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* 夜里的收音机：深蓝底。琥珀色只表示"进度"和"正在放"，别的地方不用。 */
  :root {
    --bg: #171c2b; --surface: #20273b; --line: #2e3650; --ink: #eceef4; --dim: #8e96ab;
    --amber: #f0b54a; --amber-ink: #2a1e05; --warn: #ef9a84;
    --tile-s: 30%; --tile-l: 27%; --glyph-s: 50%; --glyph-l: 84%;
    --serif: "Noto Serif SC", "Songti SC", "Source Han Serif SC", "SimSun", serif;
    --sans: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #eef0f5; --surface: #ffffff; --line: #d5d9e4; --ink: #1a2238; --dim: #636c84;
      --amber: #96590a; --amber-ink: #fff8ea; --warn: #b3422a;
      --tile-s: 34%; --tile-l: 82%; --glyph-s: 40%; --glyph-l: 27%;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 16px 8px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; gap: 14px; }
  #q { flex: 1; min-width: 0; background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
    color: var(--ink); font: 16px var(--sans); padding: 8px 0; }
  #q::placeholder { color: var(--dim); }
  #q:focus { outline: none; border-bottom-color: var(--amber); }
  #qbtn { flex: none; font-size: 14px; white-space: nowrap; border: 1px solid var(--line); border-radius: 16px;
    padding: 6px 12px; }
  #qbtn b { font-variant-numeric: tabular-nums; }
  #setbtn { flex: none; width: 34px; height: 34px; margin-left: -4px; color: var(--dim); display: flex;
    align-items: center; justify-content: center; }
  #showbar { display: none; }
  #back2 { color: var(--dim); font-size: 14px; padding: 8px 12px 8px 0; }
  body.inshow .topbar { display: none; }
  body.inshow #showbar { display: block; }

  main { padding: 8px 16px 270px; max-width: 672px; margin: 0 auto; }
  .note { color: var(--dim); font-size: 14px; padding: 14px 0; }
  .lead { font-size: 14px; color: var(--dim); margin: 26px 0 2px; }

  /* 节目：一行五个小封面，只是入口 */
  .shelf { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px 10px; padding-top: 12px; }
  @media (min-width: 560px) { .shelf { grid-template-columns: repeat(8, 1fr); } }
  .tile { position: relative; display: block; min-width: 0; }
  .cover { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 1;
    border-radius: 8px; object-fit: cover;
    background: hsl(var(--h, 220) var(--tile-s) var(--tile-l));
    color: hsl(var(--h, 220) var(--glyph-s) var(--glyph-l));
    font: 700 clamp(20px, 7vw, 30px)/1 var(--serif); }
  .badge { position: absolute; top: -5px; right: -5px; min-width: 19px; height: 19px; padding: 0 5px;
    border-radius: 10px; background: var(--ink); color: var(--bg); box-shadow: 0 0 0 2px var(--bg);
    font: 700 11.5px/19px var(--sans); text-align: center; font-variant-numeric: tabular-nums; }
  #more { display: block; width: 100%; border-top: 1px solid var(--line); padding: 16px 0; color: var(--dim);
    font-size: 14px; text-align: left; text-decoration: underline; text-underline-offset: 3px; }
  .lead small { font-size: 12.5px; margin-left: 10px; opacity: .8; }
  .ep .skip { flex: none; width: 44px; color: var(--dim); font-size: 20px; }
  .bk p { font-size: 14.5px; line-height: 1.65; color: var(--dim); margin: 0 0 14px; }
  .bk .act { display: block; width: 100%; text-align: left; border-top: 1px solid var(--line); padding: 14px 0; }
  .bk .act b { display: block; font: 500 16px/1.45 var(--serif); }
  .bk .act span { display: block; font-size: 12.5px; color: var(--dim); margin-top: 3px; }
  .bk .res { font-size: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
  .mrow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 9px 0;
    border-top: 1px solid var(--line); }
  .mrow .cover { width: 40px; flex: none; font-size: 20px; border-radius: 6px; }
  .mrow .n { flex: 1; min-width: 0; font: 500 16px/1.4 var(--serif); }
  .mrow .st { flex: none; font-size: 13px; color: var(--dim); }
  .mrow.off .cover, .mrow.off .n { opacity: .4; }

  /* 节目页抬头 */
  .showhead { display: flex; gap: 14px; align-items: center; padding: 4px 0 14px; }
  .showhead .cover { width: 72px; flex: none; font-size: 34px; border-radius: 10px; }
  .showhead h1, .qhead h1 { font: 700 22px/1.3 var(--serif); margin: 0; }
  .showhead p, .qhead p { margin: 3px 0 0; font-size: 13px; color: var(--dim); }
  .qhead { padding: 4px 0 14px; }

  /* 单集：一行一集，用线分开。标题是主角，两边的按钮退后。 */
  .ep { display: flex; align-items: stretch; position: relative; border-top: 1px solid var(--line); }
  .ep .main { flex: 1; min-width: 0; text-align: left; padding: 13px 4px 15px 0; }
  .ep .t { font: 500 16px/1.45 var(--serif); overflow-wrap: anywhere; }
  .ep .m { font-size: 12.5px; color: var(--dim); margin-top: 4px; font-variant-numeric: tabular-nums;
    display: flex; flex-wrap: wrap; gap: 0 12px; }
  .ep .m .at { color: var(--amber); }
  .ep.done .t { color: var(--dim); }
  .ep.now .t { color: var(--amber); }
  .ep .chk { flex: none; width: 38px; display: flex; align-items: flex-start; padding-top: 14px; }
  .ep .chk svg { display: block; }
  .ep .add { flex: none; width: 44px; color: var(--dim); font: 400 26px/1 var(--sans); }
  .ep .add.in { color: var(--amber); font-weight: 600; }
  .ep .grip { flex: none; width: 38px; color: var(--dim); font-size: 20px; text-align: left; touch-action: none; cursor: grab; }
  .ep .rm { flex: none; width: 40px; color: var(--dim); font-size: 19px; text-align: right; }
  .ep.shift { transition: transform .16s ease; }
  .ep.drag { z-index: 3; background: var(--surface); border-top-color: transparent; border-radius: 10px;
    box-shadow: 0 8px 22px rgba(0, 0, 0, .35); transition: none; }
  .ep.drag .grip { color: var(--ink); cursor: grabbing; }
  @media (prefers-reduced-motion: reduce) { .ep.shift { transition: none; } }
  #startq { margin: 2px 0 16px; background: var(--amber); color: var(--amber-ink); font-size: 15px; font-weight: 600;
    padding: 9px 18px; border-radius: 20px; }

  /* 播放器 */
  #player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface);
    border-top: 1px solid var(--line); padding: 12px 16px calc(10px + env(safe-area-inset-bottom)); z-index: 6; }
  #pGo { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
  #pCover { flex: none; width: 46px; }
  #pCover:empty { display: none; }
  #pCover .cover { font-size: 22px; border-radius: 7px; }
  #pGo .txt { flex: 1; min-width: 0; }
  #pTitle { font: 500 15px/1.4 var(--serif); overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #pShow { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #msg { font-size: 12.5px; color: var(--warn); margin-top: 6px; display: none; }
  #seek { width: 100%; margin: 8px 0 0; accent-color: var(--amber); height: 24px; }
  .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim);
    font-variant-numeric: tabular-nums; }
  #panel { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
  #panel[hidden] { display: none; }
  #panel::-webkit-scrollbar { display: none; }
  #panel button { flex: none; min-width: 46px; height: 36px; padding: 0 11px; border-radius: 18px;
    border: 1px solid var(--line); font-size: 14px; font-variant-numeric: tabular-nums; }
  #panel button.on { border-color: var(--ink); background: var(--ink); color: var(--bg); font-weight: 600; }
  .ctl { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .ctl button { min-width: 56px; height: 48px; border-radius: 24px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .ctl .sm { color: var(--dim); font-size: 13.5px; }
  .ctl .sm.on { color: var(--ink); font-weight: 600; }
  .ctl .skip { font-size: 15px; font-weight: 600; }
  #play { display: flex; align-items: center; justify-content: center; background: var(--amber); color: var(--amber-ink);
    width: 58px; min-width: 58px; height: 58px; border-radius: 29px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="topbar">
      <input id="q" type="search" placeholder="搜索单集标题或嘉宾" aria-label="搜索单集" autocomplete="off">
      <button id="qbtn">播放列表</button>
      <button id="setbtn" aria-label="设置"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3.9a7.5 7.5 0 0 0-2.6-1.5L14.1 2.5h-4l-.4 2.5a7.5 7.5 0 0 0-2.6 1.5l-2.3-.9-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.3-.9a7.5 7.5 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 2.6-1.5l2.3.9 2-3.4z"/></svg></button>
    </div>
    <div id="showbar"><button id="back2">‹ 首页</button></div>
  </div>
</header>
<main id="list"><div class="note">正在加载节目…</div></main>

<div id="player">
  <div class="wrap">
    <button id="pGo" aria-label="打开这档节目">
      <div id="pCover"></div>
      <div class="txt"><div id="pTitle">选一集开始听</div><div id="pShow">&nbsp;</div></div>
    </button>
    <div id="msg"></div>
    <input id="seek" type="range" min="0" max="1" step="1" value="0" aria-label="播放进度" disabled>
    <div class="times"><span id="cur">0:00</span><span id="rem">0:00</span></div>
    <div id="panel" hidden></div>
    <div class="ctl">
      <button id="rate" class="sm" aria-label="播放速度">1x</button>
      <button id="back" class="skip" aria-label="后退15秒">−15</button>
      <button id="play" aria-label="播放"></button>
      <button id="fwd" class="skip" aria-label="前进15秒">+15</button>
      <button id="sleep" class="sm" aria-label="睡眠定时">定时</button>
    </div>
  </div>
</div>
<audio id="a" preload="metadata"></audio>

<script>
// 节目数据在 shows.json 里，由 GitHub Actions 定时更新；本页只负责播放和记进度。
// 首页：小封面入口 + 听到一半的 + 新出的。#s-<节目id> 是节目页，#queue 是播放列表。
const SKIP = 15;
const RATES = [0.8, 1, 1.25, 1.5, 1.75, 2, 2.5, 3];
const SLEEPS = [15, 30, 60, -1]; // 分钟；-1 = 放完这一集
const NEW_DAYS = 14;             // 多少天内算"新出的"
const KEY = "xyzplayer.v1";
const ICON_PLAY = '<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>';

const $ = id => document.getElementById(id);
const a = $("a");
let SHOWS = [];
const EPS = {};

// ----- 存储（只在当前浏览器里）-----
let state = { prog: {}, rate: 1, showRate: {}, last: null, hidden: {}, queue: [] };
let storageOK = true;
try {
  const raw = localStorage.getItem(KEY);
  if (raw) state = Object.assign(state, JSON.parse(raw));
} catch (e) { storageOK = false; }
if (!state.hidden) state.hidden = {};
if (!state.showRate) state.showRate = {};
if (!Array.isArray(state.queue)) state.queue = [];
// 早先的版本点 × 会顺带标成"已听"，现在不这样了：把那些改回"没听完"
Object.values(state.prog).forEach(p => { if (p && p.skip && p.done) p.done = false; });
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { storageOK = false; }
}

let cur = null;         // 当前单集 id
let pendingSeek = null; // 元数据加载后要跳到的位置
let seeking = false;
let sleepMode = 0, sleepAt = 0, sleepTick = null; // 0 关；>0 分钟；-1 放完这一集
let panelKind = null;   // 当前展开的面板："rate" / "sleep" / null
let lastSave = 0;
let query = "";
let loadErr = "";
const MIN_MIDWAY = 120; // 听满这么多秒才算"听到一半"；点开听两句就关的不算
const PAGE = 40;        // 节目页一次显示多少集
const shown = {};       // 每档节目当前显示到第几集

// ----- 小工具 -----
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function clock(s) { // 播放器上的时间码
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(ss).padStart(2, "0");
}
function span(min) { // 259 -> "4 小时 19 分"
  min = Math.max(1, Math.round(min));
  const h = Math.floor(min / 60), m = min % 60;
  return h ? h + " 小时" + (m ? " " + m + " 分" : "") : m + " 分钟";
}
function dayNum(d) { const p = d.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5; }
function todayStr() { // 日期统一按旧金山时间算，和 shows.json 里存的一致
  try { return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Los_Angeles" }).format(new Date()); }
  catch (e) { return new Date(Date.now() - 8 * 36e5).toISOString().slice(0, 10); }
}
function today() { return dayNum(todayStr()); }
function ageDays(d) { return d ? today() - dayNum(d) : Infinity; }
function when(d) { // "3 天前"；两周以上写日期
  const n = ageDays(d);
  if (n <= 0) return "今天";
  if (n === 1) return "昨天";
  if (n < NEW_DAYS) return n + " 天前";
  const p = d.split("-");
  const thisYear = +todayStr().slice(0, 4);
  return (+p[0] === thisYear ? "" : p[0] + "年") + (+p[1]) + "月" + (+p[2]) + "日";
}
function rateOf(showId) { return state.showRate[showId] || state.rate || 1; }
function isDone(id) { return !!(state.prog[id] || {}).done; }
function midway(id) { // 听到一半：听过一阵子、没听完
  const p = state.prog[id];
  return !!p && !p.done && !p.skip && p.t > MIN_MIDWAY;
}
function skipped(id) { return !!(state.prog[id] || {}).skip; } // 在首页点过 ×：不再往首页上放
function resumeAt(p) { // 该从哪里接着放；接近结尾或没有进度就从头
  if (!p || !(p.t > 5)) return 0;
  if (p.d && p.t > p.d - 20) return 0;
  return p.t;
}
function isNew(e) { return ageDays(e.date) < NEW_DAYS && !isDone(e.id) && !skipped(e.id); }
function viewShow() {
  const m = /^#s-([0-9a-f]{24})$/.exec(location.hash);
  return m ? SHOWS.find(s => s.id === m[1]) || null : null;
}
function viewQueue() { return location.hash === "#queue"; }
function viewSettings() { return location.hash === "#settings"; }

// ----- 播放列表 -----
function toggleQueue(id) {
  const i = state.queue.indexOf(id);
  if (i >= 0) state.queue.splice(i, 1); else state.queue.push(id);
  save(); render();
}
function moveQueue(i, d) {
  const j = i + d;
  if (j < 0 || j >= state.queue.length) return;
  const q = state.queue;
  [q[i], q[j]] = [q[j], q[i]];
  save(); render();
}
function nextInQueue() {
  const i = state.queue.indexOf(cur);
  const n = i >= 0 ? state.queue[i + 1] : state.queue[0];
  if (n && EPS[n]) load(n, true);
}

// ----- 进度环：没听是空圈，听到一半是一段琥珀色弧，听完是灰底的勾 -----
function ring(id) {
  const p = state.prog[id] || {};
  const R = 9, C = 2 * Math.PI * R;
  let inner;
  if (p.done) {
    inner = '<circle cx="12" cy="12" r="10" fill="var(--line)"/>' +
      '<path d="M7.5 12.3l3 3 6-6.4" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
  } else {
    inner = '<circle cx="12" cy="12" r="' + R + '" fill="none" stroke="var(--dim)" stroke-opacity=".55" stroke-width="1.5"/>';
    const e = EPS[id];
    const total = p.d || (e ? e.min * 60 : 0);
    if (p.t > 5 && total) {
      const f = Math.min(1, p.t / total);
      inner += '<circle cx="12" cy="12" r="' + R + '" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-linecap="round"' +
        ' stroke-dasharray="' + (C * f).toFixed(2) + ' ' + C.toFixed(2) + '" transform="rotate(-90 12 12)"/>';
    }
  }
  return '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">' + inner + '</svg>';
}

// ----- 单集行 -----
function meta(e, withShow) {
  const p = state.prog[e.id] || {};
  const m = el("div", "m");
  if (withShow) m.appendChild(el("span", null, e.show));
  if (e.date) m.appendChild(el("span", null, when(e.date)));
  const total = p.d || e.min * 60; // 有的 RSS 不写时长，这时 e.min 是 0
  if (p.done) {
    if (total) m.appendChild(el("span", null, span(total / 60)));
    m.appendChild(el("span", null, "已听完"));
  } else if (p.t > 5 && total) {
    m.appendChild(el("span", "at", "还剩 " + span((total - p.t) / 60))); // 原速时长，不随倍速变
  } else if (p.t > 5) {
    m.appendChild(el("span", "at", "听到 " + clock(p.t)));
  } else if (total) {
    m.appendChild(el("span", null, span(total / 60)));
  }
  return m;
}
function row(e, withShow, canSkip) {
  const done = isDone(e.id);
  const r = el("div", "ep" + (done ? " done" : "") + (e.id === cur ? " now" : ""));
  const c = el("button", "chk");
  c.innerHTML = ring(e.id);
  c.setAttribute("aria-label", done ? "标为未听" : "标为已听");
  c.onclick = () => { // 只切换"听过"的标记，不动已经记下的进度
    const q = state.prog[e.id] = state.prog[e.id] || { t: 0 };
    q.done = !q.done;
    delete q.skip;
    save(); render();
  };
  const b = el("button", "main");
  b.append(el("div", "t", e.title), meta(e, withShow));
  b.onclick = () => play(e.id);
  const inQ = state.queue.includes(e.id);
  const add = el("button", "add" + (inQ ? " in" : ""), inQ ? "−" : "+");
  add.setAttribute("aria-label", inQ ? "从播放列表移除" : "加入播放列表");
  add.onclick = () => toggleQueue(e.id);
  if (canSkip) { // "听到一半的"里：右边是"先不听了"。只是不再往首页上放，不算听过，进度也留着
    const sk = el("button", "skip", "×");
    sk.setAttribute("aria-label", "先不听了，从首页移走");
    sk.onclick = () => {
      const q = state.prog[e.id] = state.prog[e.id] || { t: 0 };
      q.skip = true;
      save(); render();
    };
    r.append(c, b, sk);
  } else {
    r.append(c, b, add);
  }
  return r;
}

// ----- 拖动排序：按住手柄上下拖，松手落位 -----
function startDrag(ev, i, grip) {
  if (ev.button > 0) return;
  ev.preventDefault();
  const rows = [...document.querySelectorAll("#list .ep")];
  const me = rows[i];
  const rects = rows.map(r => { const b = r.getBoundingClientRect(); return { top: b.top + scrollY, h: b.height }; });
  const startY = ev.clientY + scrollY;
  let to = i, lastY = ev.clientY;
  me.classList.add("drag");
  try { grip.setPointerCapture(ev.pointerId); } catch (e) {}
  const place = () => {
    const dy = lastY + scrollY - startY;
    me.style.transform = "translateY(" + dy + "px)";
    const c = rects[i].top + rects[i].h / 2 + dy;
    let n = i;
    rows.forEach((r, j) => {
      if (j === i) return;
      const cj = rects[j].top + rects[j].h / 2;
      let shift = 0;
      if (j < i && c < cj) { shift = rects[i].h; n--; }
      else if (j > i && c > cj) { shift = -rects[i].h; n++; }
      r.classList.add("shift");
      r.style.transform = shift ? "translateY(" + shift + "px)" : "";
    });
    to = n;
  };
  const timer = setInterval(() => { // 拖到屏幕上下边缘时自动滚动
    const bottom = innerHeight - $("player").offsetHeight;
    if (lastY < 90) scrollBy(0, -10);
    else if (lastY > bottom - 40) scrollBy(0, 10);
    else return;
    place();
  }, 16);
  const move = e => { lastY = e.clientY; place(); };
  const end = () => {
    clearInterval(timer);
    grip.removeEventListener("pointermove", move);
    grip.removeEventListener("pointerup", end);
    grip.removeEventListener("pointercancel", end);
    if (to !== i) {
      const [x] = state.queue.splice(i, 1);
      state.queue.splice(to, 0, x);
      save();
    }
    render();
  };
  grip.addEventListener("pointermove", move);
  grip.addEventListener("pointerup", end);
  grip.addEventListener("pointercancel", end);
}

// ----- 播放列表里的一行：手柄在左，移除在右 -----
function queueRow(e, i, n) {
  const r = el("div", "ep" + (e.id === cur ? " now" : ""));
  const grip = el("button", "grip", "≡");
  grip.setAttribute("aria-label", "拖动调整顺序，或用上下方向键");
  grip.addEventListener("pointerdown", ev => startDrag(ev, i, grip));
  grip.addEventListener("keydown", ev => {
    const d = ev.key === "ArrowUp" ? -1 : ev.key === "ArrowDown" ? 1 : 0;
    if (!d || i + d < 0 || i + d >= n) return;
    ev.preventDefault();
    moveQueue(i, d);
    const g = document.querySelectorAll("#list .grip")[i + d];
    if (g) g.focus();
  });
  const b = el("button", "main");
  b.append(el("div", "t", e.title), meta(e, true));
  b.onclick = () => play(e.id);
  const rm = el("button", "rm", "×");
  rm.setAttribute("aria-label", "从播放列表移除");
  rm.onclick = () => toggleQueue(e.id);
  r.append(grip, b, rm);
  return r;
}

// ----- 封面：有图用图，没有就用节目名的第一个字 -----
function cover(s) {
  const hue = parseInt(s.id.slice(-6), 16) % 360;
  const glyph = () => {
    const d = el("div", "cover", s.title.trim().charAt(0));
    d.style.setProperty("--h", hue);
    d.setAttribute("aria-hidden", "true");
    return d;
  };
  if (!s.cover) return glyph();
  const img = el("img", "cover");
  img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
  img.style.setProperty("--h", hue);
  img.onerror = () => img.replaceWith(glyph());
  img.src = s.cover;
  return img;
}
function tile(s) {
  const fresh = s.episodes.filter(e => e.audio && isNew(e)).length;
  const b = el("button", "tile");
  b.setAttribute("aria-label", s.title + (fresh ? "，" + fresh + " 集新出的还没听" : ""));
  b.appendChild(cover(s));
  if (fresh) b.appendChild(el("span", "badge", String(fresh)));
  b.onclick = () => { location.hash = "s-" + s.id; };
  return b;
}
function manageRow(s) {
  const hidden = !!state.hidden[s.id];
  const b = el("button", "mrow" + (hidden ? " off" : ""));
  b.append(cover(s), el("div", "n", s.title), el("div", "st", hidden ? "已隐藏" : "显示中"));
  b.onclick = () => { if (hidden) delete state.hidden[s.id]; else state.hidden[s.id] = true; save(); render(); };
  return b;
}

// ----- 备份与恢复：进度只存在这个浏览器里，导出成文件可以兜底 -----
let backupMsg = "";
function exportBackup() {
  const d = new Date();
  const name = "贴贴电台备份-" + d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0") + ".json";
  const data = { app: "xyzplayer", version: 1, exported: d.toISOString(), state: state };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }));
  const link = document.createElement("a");
  link.href = url; link.download = name;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  const n = Object.keys(state.prog).length;
  backupMsg = "已导出 " + name + "，里面有 " + n + " 集的进度。文件在手机的“下载”里。";
  render();
}
function importBackup(text) {
  let b;
  try { b = JSON.parse(text); } catch (e) { b = null; }
  const src = b && b.app === "xyzplayer" && b.state && typeof b.state.prog === "object" ? b.state : null;
  if (!src) { backupMsg = "这个文件不是本页面导出的备份，没有做任何改动。"; render(); return; }
  // 每一集保留较新的那份进度；播放列表、倍速、隐藏的节目以备份为准
  let taken = 0;
  Object.keys(src.prog).forEach(id => {
    const x = src.prog[id];
    if (!/^[0-9a-f]{24}$/.test(id) || !x || typeof x !== "object") return;
    const mine = state.prog[id];
    if (!mine || (x.at || 0) > (mine.at || 0) || (x.done && !mine.done && !(mine.at > (x.at || 0)))) {
      state.prog[id] = { t: Number(x.t) || 0, d: Number(x.d) || undefined, at: Number(x.at) || undefined, done: !!x.done };
      if (x.skip) state.prog[id].skip = true;
      taken++;
    }
  });
  if (Array.isArray(src.queue)) state.queue = src.queue.filter(id => EPS[id]);
  if (src.hidden && typeof src.hidden === "object") state.hidden = src.hidden;
  if (src.showRate && typeof src.showRate === "object") state.showRate = src.showRate;
  if (RATES.includes(src.rate)) state.rate = src.rate;
  if (!cur && src.last && EPS[src.last]) state.last = src.last;
  save(); applyRate();
  backupMsg = "已恢复：更新了 " + taken + " 集的进度，播放列表有 " + state.queue.length + " 集。";
  render();
}
function settingsView(list) {
  const head = el("div", "qhead");
  head.append(el("h1", null, "设置"), el("p", null, "这些设置只对这台手机生效"));
  list.appendChild(head);
  list.appendChild(el("div", "lead", "显示哪些节目"));
  SHOWS.forEach(s => list.appendChild(manageRow(s)));
  list.appendChild(el("div", "lead", "备份与恢复"));
  const box = el("div", "bk");
  box.style.marginTop = "10px";
  box.appendChild(el("p", null, "听到哪、播放列表、倍速，都只存在这台手机的这个浏览器里。清除浏览器数据或换手机之前，先导出一份。导出的是一个小文件，可以再存到网盘里。"));
  const ex = el("button", "act");
  ex.append(el("b", null, "导出备份文件"), el("span", null, "现在有 " + Object.keys(state.prog).length + " 集的进度"));
  ex.onclick = exportBackup;
  const im = el("button", "act");
  im.append(el("b", null, "从备份文件恢复"), el("span", null, "每一集保留较新的进度；播放列表、倍速、隐藏的节目以备份为准"));
  const file = document.createElement("input");
  file.type = "file"; file.accept = "application/json,.json"; file.hidden = true;
  file.onchange = () => {
    const f = file.files && file.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => importBackup(String(rd.result));
    rd.onerror = () => { backupMsg = "这个文件读不出来，没有做任何改动。"; render(); };
    rd.readAsText(f);
  };
  im.onclick = () => file.click();
  box.append(ex, im, file);
  if (backupMsg) box.appendChild(el("div", "res", backupMsg));
  list.appendChild(box);
}

// ----- 渲染 -----
function render() {
  const list = $("list");
  const show = viewShow();
  const inQueue = viewQueue();
  const inSettings = viewSettings();
  document.body.classList.toggle("inshow", !!show || inQueue || inSettings);
  const qb = $("qbtn");
  qb.textContent = "播放列表";
  if (state.queue.length) qb.append(" ", el("b", null, String(state.queue.length)));
  list.textContent = "";
  if (loadErr) { list.appendChild(el("div", "note", loadErr)); return; }
  if (!storageOK) list.appendChild(el("div", "note", "这个浏览器不让保存数据，关掉页面后进度会丢。"));
  const playable = Object.values(EPS);

  if (inSettings) { settingsView(list); return; }

  if (inQueue) {
    const items = state.queue.map(id => EPS[id]).filter(Boolean);
    const head = el("div", "qhead");
    const total = items.reduce((n, e) => n + e.min, 0);
    head.append(el("h1", null, "播放列表"),
      el("p", null, items.length ? items.length + " 集，共 " + span(total) + "，放完一集自动接着放下一集" : "只存在这台手机上"));
    list.appendChild(head);
    if (!items.length) {
      list.appendChild(el("div", "note", "列表还是空的。点任意单集右边的 +，把它加进来。"));
      return;
    }
    if (!state.queue.includes(cur)) {
      const st = el("button", null, "从第一集开始放");
      st.id = "startq";
      st.onclick = () => load(items[0].id, true);
      list.appendChild(st);
    }
    items.forEach((e, i) => list.appendChild(queueRow(e, i, items.length)));
    return;
  }

  if (show) {
    const ok = show.episodes.filter(e => e.audio);
    const unheard = ok.filter(e => !isDone(e.id)).length;
    const head = el("div", "showhead");
    const txt = el("div");
    txt.append(el("h1", null, show.title),
      el("p", null, !ok.length ? "单集还没抓到" : unheard ? "共 " + ok.length + " 集，" + unheard + " 集没听" : "共 " + ok.length + " 集，都听完了"));
    head.append(cover(show), txt);
    list.appendChild(head);
    if (!ok.length) list.appendChild(el("div", "note", "这档节目的单集还没抓到，下次更新后会出现。"));
    const limit = shown[show.id] || PAGE;
    ok.slice(0, limit).forEach(e => list.appendChild(row(EPS[e.id], false)));
    if (ok.length > limit) {
      const more = el("button", null, "再显示 " + Math.min(PAGE, ok.length - limit) + " 集（还有 " + (ok.length - limit) + " 集）");
      more.id = "more";
      more.onclick = () => { shown[show.id] = limit + PAGE; render(); };
      list.appendChild(more);
    }
    return;
  }

  if (query) {
    const q = query.toLowerCase();
    const hits = playable.filter(e => (e.title + " " + e.show).toLowerCase().includes(q));
    if (!hits.length) list.appendChild(el("div", "note", "没有标题里带“" + query + "”的单集。"));
    hits.slice(0, 60).forEach(e => list.appendChild(row(e, true)));
    if (hits.length > 60) list.appendChild(el("div", "note", "还有 " + (hits.length - 60) + " 集没列出来，多打几个字缩小范围。"));
    return;
  }

  const visible = SHOWS.filter(s => !state.hidden[s.id]);
  if (!visible.length) list.appendChild(el("div", "note", "节目都被隐藏了。点右上角的齿轮，把想听的显示出来。"));
  const shelf = el("div", "shelf");
  visible.forEach(s => shelf.appendChild(tile(s)));
  list.appendChild(shelf);

  const going = playable.filter(e => midway(e.id))
    .sort((x, y) => (state.prog[y.id].at || 0) - (state.prog[x.id].at || 0)).slice(0, 5);
  if (going.length) {
    const lead = el("div", "lead", "听到一半的");
    lead.appendChild(el("small", null, "先不听了点 ×"));
    list.appendChild(lead);
    going.forEach(e => list.appendChild(row(e, true, true)));
  }
  // 每档节目最多列两集，免得更新勤的节目把别的挤掉；其余的看封面角标
  const perShow = {};
  const fresh = playable.filter(e => !state.hidden[e.showId] && isNew(e) && !midway(e.id))
    .sort((x, y) => dayNum(y.date) - dayNum(x.date))
    .filter(e => (perShow[e.showId] = (perShow[e.showId] || 0) + 1) <= 2).slice(0, 14);
  if (fresh.length) {
    list.appendChild(el("div", "lead", "新出的"));
    fresh.forEach(e => list.appendChild(row(e, true)));
  } else if (!going.length && visible.length) {
    list.appendChild(el("div", "note", "最近两周没有新单集。点上面的封面，从节目里挑一集。"));
  }
}

// ----- 播放 -----
function showMsg(t) { const m = $("msg"); m.textContent = t || ""; m.style.display = t ? "block" : "none"; }
function applyRate() {
  const r = cur && EPS[cur] ? rateOf(EPS[cur].showId) : (state.rate || 1);
  a.defaultPlaybackRate = r;
  a.playbackRate = r;
  $("rate").textContent = r + "x";
  $("rate").classList.toggle("on", r !== 1);
}

function load(id, autoplay) {
  const e = EPS[id];
  if (!e) return;
  if (cur && cur !== id) record(true);
  cur = id;
  state.last = id; save();
  showMsg("");
  const p = state.prog[id] || {};
  pendingSeek = resumeAt(p);
  a.src = e.audio;
  applyRate();
  $("pTitle").textContent = e.title;
  $("pShow").textContent = e.show;
  const s = SHOWS.find(x => x.id === e.showId);
  $("pCover").textContent = "";
  if (s) $("pCover").appendChild(cover(s));
  $("seek").disabled = false;
  $("seek").max = p.d || e.min * 60 || 1;
  $("seek").value = pendingSeek;
  $("cur").textContent = clock(pendingSeek);
  $("rem").textContent = "-" + clock(($("seek").max) - pendingSeek);
  if ("mediaSession" in navigator) {
    try {
      const md = { title: e.title, artist: e.show };
      if (e.cover) md.artwork = [{ src: e.cover }];
      navigator.mediaSession.metadata = new MediaMetadata(md);
    } catch (err) {}
  }
  if (panelKind) openPanel(panelKind);
  render();
  if (autoplay) a.play().catch(() => showMsg("没能开始播放，再点一次播放键。"));
}
function play(id) {
  const p = state.prog[id];
  if (p && p.skip) { delete p.skip; save(); } // 又点开听了：重新算作在听
  if (id === cur) { toggle(); return; }
  load(id, true);
}
function toggle() {
  if (!cur) return;
  if (a.paused) a.play().catch(() => showMsg("没能开始播放，再点一次播放键。"));
  else a.pause();
}
function skip(d) {
  if (!cur || !isFinite(a.duration)) return;
  a.currentTime = Math.min(Math.max(0, a.currentTime + d), a.duration - 1);
  record(true);
}
function record(force) {
  if (!cur || pendingSeek !== null) return;
  const now = Date.now();
  if (!force && now - lastSave < 5000) return;
  lastSave = now;
  const p = state.prog[cur] = state.prog[cur] || {};
  p.t = a.currentTime;
  if (isFinite(a.duration)) p.d = a.duration;
  p.at = now;
  if (p.d && p.t > p.d - 20) { p.done = true; }
  save();
}

a.addEventListener("loadedmetadata", () => {
  $("seek").max = Math.floor(a.duration);
  if (pendingSeek) a.currentTime = Math.min(pendingSeek, a.duration - 2);
  pendingSeek = null;
  applyRate();
});
a.addEventListener("timeupdate", () => {
  if (pendingSeek !== null) return;
  if (!seeking) {
    $("seek").value = a.currentTime;
    $("cur").textContent = clock(a.currentTime);
    $("rem").textContent = "-" + clock((a.duration || 0) - a.currentTime);
  }
  record(false);
});
a.addEventListener("play", () => { $("play").innerHTML = ICON_PAUSE; $("play").setAttribute("aria-label", "暂停"); showMsg(""); });
a.addEventListener("pause", () => { $("play").innerHTML = ICON_PLAY; $("play").setAttribute("aria-label", "播放"); record(true); render(); });
a.addEventListener("ended", () => {
  const p = state.prog[cur] = state.prog[cur] || {};
  p.done = true; p.t = 0;
  // 这一集在播放列表里：放完就移出列表，接着放它后面那一集
  let next = null;
  const i = state.queue.indexOf(cur);
  if (i >= 0) { state.queue.splice(i, 1); next = state.queue[i] || null; }
  save(); render();
  if (sleepMode === -1) { setSleep(0); return; } // 定时"放完这一集"：不接着放
  if (next && EPS[next]) load(next, true);
});
a.addEventListener("error", () => {
  if (!cur) return;
  showMsg("这一集放不出来。先检查网络；网络没问题的话，是这一集的音频地址有误。");
});
a.addEventListener("waiting", () => { if (!a.paused) showMsg("缓冲中…"); });
a.addEventListener("playing", () => showMsg(""));

// ----- 倍速和定时：点开一排直接选 -----
function openPanel(kind) {
  const panel = $("panel");
  panelKind = kind;
  panel.textContent = "";
  panel.hidden = !kind;
  if (kind === "rate") {
    const now = cur && EPS[cur] ? rateOf(EPS[cur].showId) : (state.rate || 1);
    RATES.forEach(r => {
      const b = el("button", r === now ? "on" : null, r + "x");
      b.onclick = () => {
        state.rate = r;                               // 没单独设过的节目沿用最近选的
        if (cur && EPS[cur]) state.showRate[EPS[cur].showId] = r; // 这档节目记住自己的倍速
        save(); applyRate(); openPanel(null); render();
      };
      panel.appendChild(b);
    });
  } else if (kind === "sleep") {
    const opts = [[0, "不定时"]].concat(SLEEPS.map(v => [v, v === -1 ? "放完这一集" : v + " 分钟"]));
    opts.forEach(([v, label]) => {
      const b = el("button", v === sleepMode ? "on" : null, label);
      b.onclick = () => { setSleep(v); openPanel(null); };
      panel.appendChild(b);
    });
  }
}
function showSleep() {
  const b = $("sleep");
  if (sleepMode === 0) b.textContent = "定时";
  else if (sleepMode === -1) b.textContent = "本集完";
  else b.textContent = clock(Math.max(0, (sleepAt - Date.now()) / 1000));
  b.classList.toggle("on", sleepMode !== 0);
}
function setSleep(v) {
  sleepMode = v;
  sleepAt = v > 0 ? Date.now() + v * 60000 : 0;
  clearInterval(sleepTick);
  sleepTick = null;
  if (v > 0) {
    // 独立计时：到点就停并且把定时清掉，不管当时是在放还是已经暂停
    sleepTick = setInterval(() => {
      if (Date.now() >= sleepAt) { if (!a.paused) a.pause(); setSleep(0); }
      else showSleep();
    }, 1000);
  }
  showSleep();
}
$("rate").onclick = () => openPanel(panelKind === "rate" ? null : "rate");
$("sleep").onclick = () => openPanel(panelKind === "sleep" ? null : "sleep");

// ----- 其他控件 -----
$("play").innerHTML = ICON_PLAY;
$("play").onclick = toggle;
$("back").onclick = () => skip(-SKIP);
$("fwd").onclick = () => skip(SKIP);
$("pGo").onclick = () => { if (cur && EPS[cur]) location.hash = "s-" + EPS[cur].showId; };
const seek = $("seek");
seek.addEventListener("input", () => { seeking = true; $("cur").textContent = clock(seek.value); });
seek.addEventListener("change", () => {
  seeking = false;
  if (pendingSeek !== null) { pendingSeek = Number(seek.value); return; }
  a.currentTime = Number(seek.value);
  record(true);
});
$("q").addEventListener("input", () => { query = $("q").value.trim(); render(); });
$("back2").onclick = () => { location.hash = ""; };
$("qbtn").onclick = () => { location.hash = "queue"; };
$("setbtn").onclick = () => { backupMsg = ""; location.hash = "settings"; };
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession;
  const set = (k, f) => { try { ms.setActionHandler(k, f); } catch (e) {} };
  set("play", () => a.play());
  set("pause", () => a.pause());
  set("seekbackward", () => skip(-SKIP));
  set("seekforward", () => skip(SKIP));
  set("nexttrack", nextInQueue);
  set("seekto", d => { if (d && d.seekTime != null) { a.currentTime = d.seekTime; record(true); } });
}
document.addEventListener("visibilitychange", () => { if (document.hidden) record(true); else showSleep(); });
window.addEventListener("pagehide", () => record(true));

// ----- 启动 -----
applyRate();
fetch("shows.json?t=" + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(j => {
    SHOWS = j.shows || [];
    SHOWS.forEach(s => s.episodes.forEach(e => {
      if (e.audio) EPS[e.id] = Object.assign({ show: s.title, showId: s.id, cover: s.cover || null }, e);
    }));
    state.queue = state.queue.filter(id => EPS[id]);
    render();
    if (state.last && EPS[state.last]) load(state.last, false);
  })
  .catch(() => { loadErr = "节目列表没加载出来。检查网络后刷新页面。"; render(); });
</script>
