name: 更新节目列表

on:
  schedule:
    # 每天两次：太平洋时间约 4:43 和 16:43（冬令时）
    - cron: "43 12 * * *"
    - cron: "43 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - shows.json
      - update.py
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-shows
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 读取小宇宙节目页
        run: python3 update.py
      - name: 有变化就提交
        run: |
          git config user.name "podcast-updater"
          git config user.email "actions@users.noreply.github.com"
          git add shows.json update-log.txt
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "自动更新节目列表"
            git pull --rebase origin main
            git push
          fi
