name: 更新节目列表

on:
  schedule:
    # GitHub 的定时是"尽量按时"，偶尔会晚点甚至漏掉一次，所以一天排四次。
    # UTC 1:23 / 7:23 / 13:23 / 19:23，即太平洋时间（冬令时）17:23 / 23:23 / 5:23 / 11:23。
    # 注意：这一段要由仓库主人的账号提交，GitHub 才会让定时生效。
    - cron: "23 1,7,13,19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - shows.json
      - update.py
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-shows
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 读取小宇宙节目页
        run: python3 update.py
      - name: 有变化就提交
        run: |
          git config user.name "podcast-updater"
          git config user.email "actions@users.noreply.github.com"
          git add shows.json update-log.txt
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "自动更新节目列表"
            git pull --rebase origin main
            git push
          fi
